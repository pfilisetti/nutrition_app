[project]
name = "28-personal-project"
version = "0.1.0"
description = "Nutrition AI assistant — RAG over personal docs + USDA tool-calling, powered by NVIDIA LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.2.0",
    "langchain>=1.0.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "docx2txt>=0.8",
    "openpyxl>=3.1.0",
    "unstructured>=0.15.0",
    "requests>=2.32.5",
    "pytz>=2026.1.post1",
]

[project.scripts]
nutrition = "nutrition_app.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrition_app"]
